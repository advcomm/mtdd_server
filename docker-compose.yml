services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mtdd
      POSTGRES_PASSWORD: mtdd
      POSTGRES_DB: mtdd_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtdd -d mtdd_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  mtdd_server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MTDD_LISTEN: unix:/run/mtdd/grpc.sock
      MTDD_UNIX_SOCKET_MODE: 666
      MTDD_HOST_INDEX: 0
      MTDD_PG_HOST: postgres
      MTDD_NOTIFY_ENABLED: 1
      MTDD_HEALTH_REQUIRE_PG: 1
    volumes:
      - mtdd_socket:/run/mtdd
    healthcheck:
      test: ["CMD", "pgrep", "-x", "mtdd_server"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      mtdd_server:
        condition: service_healthy
    volumes:
      - mtdd_socket:/run/mtdd
      - ./docker/nginx-mtdd.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "50051:50051"

  notify_coordinator:
    profiles: ["notify-coordinator"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    environment:
      MTDD_LISTEN: unix:/run/mtdd/grpc.sock
      MTDD_UNIX_SOCKET_MODE: 666
      MTDD_NOTIFY_ENABLED: 1
      MTDD_HEALTH_REQUIRE_PG: 0
    volumes:
      - notify_socket:/run/mtdd

  shard_only:
    profiles: ["shard-only"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MTDD_LISTEN: unix:/run/mtdd/grpc.sock
      MTDD_UNIX_SOCKET_MODE: 666
      MTDD_HOST_INDEX: 0
      MTDD_PG_HOST: postgres
      MTDD_NOTIFY_ENABLED: 0
    volumes:
      - shard_socket:/run/mtdd

  integration:
    image: node:20-bookworm
    depends_on:
      nginx:
        condition: service_started
      mtdd_server:
        condition: service_healthy
    working_dir: /work
    volumes:
      - ./integration:/work/integration
      - ./proto:/work/proto:ro
    environment:
      MTDD_SERVER_ADDR: nginx:50051
      PG_HOST: postgres
      PG_USER: mtdd
      PG_PASSWORD: mtdd
      PG_DB: mtdd_test
    command:
      - bash
      - -c
      - cd /work/integration && npm install --silent && node query_smoke.js && node plain_sql_smoke.js && node notify_smoke.js && node notify_reconnect_smoke.js

volumes:
  mtdd_socket:
  notify_socket:
  shard_socket:

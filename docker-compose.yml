services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mtdd
      POSTGRES_PASSWORD: mtdd
      POSTGRES_DB: mtdd_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtdd -d mtdd_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  mtdd_server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MTDD_LISTEN: 0.0.0.0:50051
      MTDD_HOST_INDEX: 0
      MTDD_PG_HOST: postgres
    ports:
      - "50051:50051"

  integration:
    image: node:20-bookworm
    depends_on:
      - mtdd_server
    working_dir: /work
    volumes:
      - ./integration:/work/integration
      - ./proto:/work/proto:ro
    environment:
      MTDD_SERVER_ADDR: mtdd_server:50051
      PG_HOST: postgres
      PG_USER: mtdd
      PG_PASSWORD: mtdd
      PG_DB: mtdd_test
    command:
      - bash
      - -c
      - cd /work/integration && npm install --silent && node query_smoke.js

syntax = "proto3";

package mtdd;

// Shard-side gRPC service. Each instance runs on a DB_HOST IP and receives
// host_index so it knows which shard it represents.
service MtddShard {
  rpc Connect(ConnectRequest) returns (ConnectResponse);
  // libpq-semantic query; results stream as FlatBuffers metadata + Arrow IPC.
  rpc QueryStream(QueryRequest) returns (stream ResultChunk);
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);
}

// Coordinator-style LISTEN/NOTIFY transport (matches mtdd-notify-transport.js).
service MtddNotify {
  rpc Subscribe(NotifySubscribeRequest) returns (NotifyAck);
  rpc Unsubscribe(NotifyUnsubscribeRequest) returns (NotifyAck);
  rpc UnsubscribeAll(NotifyUnsubscribeAllRequest) returns (NotifyAck);
  rpc Publish(NotifyPublishRequest) returns (NotifyAck);
  rpc Watch(NotifyWatchRequest) returns (stream NotifyMessage);
}

enum ChunkKind {
  CHUNK_KIND_UNSPECIFIED = 0;
  CHUNK_KIND_SCHEMA = 1;
  CHUNK_KIND_BATCH = 2;
  CHUNK_KIND_TRAILER = 3;
  CHUNK_KIND_ERROR = 4;
}

// libpq connection keywords (PQconnectdbParams).
message ConnectRequest {
  int32 host_index = 1;
  string dbname = 2;
  string user = 3;
  string password = 4;
  int32 port = 5;
  string host = 6;
  string sslmode = 7;
  string connect_timeout = 8;
  string application_name = 9;
  // Deprecated alias for dbname; clients may set either.
  string database = 10;
}

message ConnectResponse {
  bool ok = 1;
  string message = 2;
}

// One bound parameter (PQexecParams).
message QueryParam {
  uint32 oid = 1;
  int32 format = 2;
  bytes value = 3;
}

// PQexecParams-style query envelope.
message QueryRequest {
  int32 host_index = 1;
  string text = 2;
  reserved 3;
  reserved "values_json";
  string name = 4;
  string row_mode = 5;
  string session_id = 6;
  reserved 7;
  reserved "response_format";
  repeated QueryParam params = 8;
  // 0 = text results, 1 = binary (libpq resultFormat).
  int32 result_format = 9;
}

message ResultChunk {
  ChunkKind kind = 1;
  bytes flatbuffer_meta = 2;
  bytes arrow_ipc = 3;
}

message DisconnectRequest {
  int32 host_index = 1;
}

message DisconnectResponse {
  bool ok = 1;
}

message NotifySubscribeRequest {
  string client_id = 1;
  string channel = 2;
  // "__global__" or tenant id string (matches resolveTidScope on the client).
  string tid_scope = 3;
}

message NotifyUnsubscribeRequest {
  string client_id = 1;
  string channel = 2;
  string tid_scope = 3;
}

message NotifyUnsubscribeAllRequest {
  string client_id = 1;
}

message NotifyPublishRequest {
  string channel = 1;
  string payload = 2;
  string tid_scope = 3;
}

message NotifyWatchRequest {
  string client_id = 1;
}

message NotifyMessage {
  string channel = 1;
  string payload = 2;
  int32 process_id = 3;
}

message NotifyAck {
  bool ok = 1;
  string message = 2;
  int32 delivered_count = 3;
}

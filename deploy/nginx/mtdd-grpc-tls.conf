upstream mtdd_grpc_backend {
    server 127.0.0.1:50051;
    keepalive 16;
}

# TLS termination at nginx; mtdd_server stays on loopback without MTDD_GRPC_TLS.
server {
    listen 443 ssl http2;

    ssl_certificate     /etc/nginx/certs/mtdd-server.crt;
    ssl_certificate_key /etc/nginx/certs/mtdd-server.key;

    location / {
        grpc_pass grpc://mtdd_grpc_backend;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
        client_max_body_size 0;
    }
}

# Alternative: enable MTDD_GRPC_TLS=1 on mtdd_server and connect clients directly
# with MTDD_GRPC_TLS_CA_FILE pointing at your CA (no nginx TLS required).

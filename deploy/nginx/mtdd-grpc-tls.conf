upstream mtdd_grpc_backend {
    server unix:/run/mtdd/grpc.sock;
    keepalive 16;
}

# Public TLS termination at nginx. Backend is plain gRPC over a unix domain socket.
server {
    listen 443 ssl http2;

    ssl_certificate     /etc/nginx/certs/mtdd-server.crt;
    ssl_certificate_key /etc/nginx/certs/mtdd-server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Enable gzip for non-gRPC locations; gRPC payloads stay on the HTTP/2 path.
    gzip on;
    gzip_types application/grpc application/grpc+proto;

    location / {
        grpc_pass grpc://mtdd_grpc_backend;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
        client_max_body_size 0;
    }
}

# Client apps use MTDD_GRPC_TLS=1 with MTDD_GRPC_TLS_CA_FILE pointing at the nginx CA.
# Do not enable MTDD_GRPC_TLS on mtdd_server — it does not terminate TLS.

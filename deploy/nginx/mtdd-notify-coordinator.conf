upstream mtdd_notify_coordinator {
    server unix:/run/mtdd/grpc.sock;
    keepalive 8;
}

server {
    listen 50052 ssl http2;

    ssl_certificate     /etc/nginx/certs/mtdd-notify.crt;
    ssl_certificate_key /etc/nginx/certs/mtdd-notify.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types application/grpc application/grpc+proto;

    location / {
        grpc_pass grpc://mtdd_notify_coordinator;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
        client_max_body_size 0;
    }
}

# Client apps set MTDD_NOTIFY_URL to this nginx TLS endpoint (e.g. coordinator.example:50052).
# Shard-only mtdd_server instances should set MTDD_NOTIFY_ENABLED=0.

upstream mtdd_notify_coordinator {
    # Dedicated LISTEN/NOTIFY coordinator (single host for all clients).
    server 10.0.0.100:50051;
    keepalive 8;
}

server {
    listen 50052 http2;

    location / {
        grpc_pass grpc://mtdd_notify_coordinator;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
        client_max_body_size 0;
    }
}

# Client apps set MTDD_NOTIFY_URL=10.0.0.100:50051 (or this nginx :50052 front-end).
# Shard-only mtdd_server instances should set MTDD_NOTIFY_ENABLED=0.
